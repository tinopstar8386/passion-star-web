<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Siêu Dự Án</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script> tailwind.config = { darkMode: 'class', } </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    
    .custom-table { border-collapse: separate; border-spacing: 0; width: 100%; }
    .custom-table thead th { position: sticky; top: 0; z-index: 20; background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; }
    .custom-table thead th:first-child { border-left: 1px solid #cbd5e1; }
    .custom-table tbody td { border-bottom: 1px solid #f1f5f9; border-right: 1px solid #e2e8f0; }
    .custom-table tbody td:first-child { border-left: 1px solid #e2e8f0; }
    .custom-table tfoot { position: sticky; bottom: 0; z-index: 30; }
    .custom-table tfoot td { border-top: 2px solid #94a3b8; border-bottom: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; }
    .custom-table tfoot td:first-child { border-left: 1px solid #cbd5e1; }
    
    .dark .custom-table thead th { background-color: #1e293b; border-bottom: 1px solid #334155; border-right: 1px solid #334155; color: #e2e8f0; }
    .dark .custom-table thead th:first-child { border-left: 1px solid #334155; }
    .dark .custom-table tbody td { border-bottom: 1px solid #1e293b; border-right: 1px solid #334155; }
    .dark .custom-table tbody td:first-child { border-left: 1px solid #334155; }
    .dark .custom-table tfoot td { border-top: 2px solid #475569; border-bottom: 1px solid #334155; border-right: 1px solid #334155; }
    .dark .custom-table tfoot td:first-child { border-left: 1px solid #334155; }
    
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    .css-spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: css-spin 1s linear infinite; }
    .dark .css-spinner { border-color: #334155; border-top-color: #818cf8; }
    @keyframes css-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .animate-sparkle { position: relative; display: inline-block; }
    .animate-sparkle::after {
      content: '✦'; position: absolute; top: -8px; right: -10px; font-size: 14px; color: #ffffff;
      animation: star-blink 1.2s infinite ease-in-out;
      text-shadow: 0 0 6px #ffffff, 0 0 12px #ffeb3b, 0 0 20px #ffffff;
    }
    @keyframes star-blink {
      0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.2; filter: drop-shadow(0 0 2px rgba(255,255,255,0.4)); }
      50% { transform: scale(1.4) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 20px #ffeb3b); }
    }

    .custom-date-input::-webkit-calendar-picker-indicator {
        background-color: #818cf8; padding: 4px; cursor: pointer; border-radius: 4px;
    }
    .custom-date-input::-webkit-calendar-picker-indicator:hover {
        background-color: #6366f1;
    }

    /* BẢNG VÀNG HOÀNG GIA */
    .spotlight-card { position: relative; overflow: hidden; z-index: 1; }
    .spotlight-card::before {
        content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 120%; height: 100%;
        background: radial-gradient(ellipse at top, rgba(255,255,255,0.25) 0%, transparent 70%);
        pointer-events: none; z-index: -1;
    }

    .real-fire-board {
      background: radial-gradient(circle at center, #271c08 0%, #09090b 100%);
      position: relative; border-radius: 1.5rem;
      border: 3px solid #fbbf24;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.6), 0 0 60px rgba(239, 68, 68, 0.3), inset 0 0 20px rgba(245, 158, 11, 0.4);
      overflow: hidden;
      animation: fire-pulse 2s ease-in-out infinite alternate;
    }
    @keyframes fire-pulse {
      0% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.5), 0 0 50px rgba(239, 68, 68, 0.3); }
      100% { box-shadow: 0 0 45px rgba(245, 158, 11, 0.9), 0 0 80px rgba(239, 68, 68, 0.6); }
    }
    
    .spark-particle {
      position: absolute; width: 5px; height: 5px; background: #fef08a; border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b, 0 0 20px #ef4444;
      animation: fly-up 2s linear infinite; pointer-events: none; z-index: 2;
    }
    @keyframes fly-up {
      0% { transform: translateY(80px) translateX(0) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-80px) translateX(20px) scale(1.2); opacity: 0; }
    }

    /* MỐC KIM CƯƠNG, VÀNG, BẠC */
    .diamond-tier-box {
        position: relative; background: linear-gradient(60deg, #3b82f6, #a855f7, #ec4899, #3b82f6);
        background-size: 300% 300%; animation: beam-anim 2.5s linear infinite;
        padding: 2.5px; border-radius: 1rem; box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
    }
    .diamond-tier-inner { background-color: #0f172a; border-radius: calc(1rem - 2.5px); height: 100%; }

    .gold-tier-box {
        position: relative; background: linear-gradient(90deg, #d97706, #fde047, #b45309);
        background-size: 200% 100%; animation: beam-anim 3s linear infinite;
        padding: 2px; border-radius: 1rem; box-shadow: 0 0 18px rgba(245, 158, 11, 0.5);
    }
    .gold-tier-inner { background: linear-gradient(145deg, #1e293b 0%, #020617 100%); border-radius: calc(1rem - 2px); height: 100%; }

    .silver-tier-box {
        position: relative; background: linear-gradient(90deg, #059669, #34d399, #047857);
        background-size: 200% 100%; animation: beam-anim 4s linear infinite;
        padding: 2px; border-radius: 1rem; box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
    }
    .silver-tier-inner { background: linear-gradient(145deg, #0f172a 0%, #020617 100%); border-radius: calc(1rem - 2px); height: 100%; }

    @keyframes beam-anim { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    /* HÀO QUANG AVATAR */
    .avatar-wrapper-royal {
        position: relative; width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
        background: linear-gradient(135deg, #ef4444, #f59e0b, #fef08a);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 25px rgba(245, 158, 11, 1), 0 0 40px rgba(239, 68, 68, 0.8);
        animation: pulse-fire 1.2s infinite alternate;
    }
    @keyframes pulse-fire {
        0% { transform: scale(1); box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
        100% { transform: scale(1.06); box-shadow: 0 0 35px rgba(239, 68, 68, 1), 0 0 55px rgba(245, 158, 11, 1); }
    }

    .avatar-wrapper-diamond {
        position: relative; width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
        background: linear-gradient(135deg, #c084fc, #3b82f6);
        display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }
    .avatar-wrapper-gold {
        position: relative; width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
        background: linear-gradient(135deg, #fef08a, #d97706);
        display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
    }
    .avatar-wrapper-silver {
        position: relative; width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
        background: linear-gradient(135deg, #34d399, #059669);
        display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(52, 211, 153, 0.6);
    }
    .glow-avatar-inner {
        position: absolute; inset: 2.5px; border-radius: 50%;
        background: #09090b; display: flex; align-items: center; justify-content: center; z-index: 10;
    }

    /* LỄ ĐÀI ĐĂNG QUANG */
    .podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 0.5rem; margin-top: 1rem; margin-bottom: 2rem; }
    .podium-block {
        width: 100%; border-top-left-radius: 8px; border-top-right-radius: 8px;
        box-shadow: inset 0 2px 5px rgba(255,255,255,0.4), inset 0 -10px 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.5);
        position: relative; display: flex; justify-content: center; padding-top: 10px;
    }
    .podium-gold { background: linear-gradient(180deg, #fde047 0%, #d97706 50%, #92400e 100%); height: 140px; z-index: 10; }
    .podium-silver { background: linear-gradient(180deg, #f1f5f9 0%, #94a3b8 50%, #334155 100%); height: 100px; z-index: 5; }
    .podium-bronze { background: linear-gradient(180deg, #fcd34d 0%, #b45309 50%, #78350f 100%); height: 75px; z-index: 5; }
    .podium-rank { font-size: 2rem; font-weight: 900; color: rgba(255,255,255,0.9); text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    
    /* ==========================================
       HIỆU ỨNG THẺ BÓNG LOÁNG (SHINE SWEEP)
       ========================================== */
    .glass-shine {
        position: relative;
        overflow: hidden;
    }
    .glass-shine::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
        transform: skewX(-25deg);
        animation: shine-sweep 6s infinite ease-in-out; 
        pointer-events: none; 
        z-index: 20;
    }
    @keyframes shine-sweep {
        0% { left: -100%; }
        40% { left: 200%; } 
        100% { left: 200%; }
    }

    /* ==========================================
       HIỆU ỨNG INTERACTIVE FOCUS CARDS (MENU VÀ IDOL CARDS)
       ========================================== */
    /* 1. HIỆU ỨNG CHO MENU BÊN TRÁI */
    #menu-container .menu-btn {
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                    filter 0.4s ease, 
                    opacity 0.4s ease, 
                    box-shadow 0.4s ease !important;
        position: relative;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
    }

    #menu-container:has(.menu-btn:hover) .menu-btn:not(:hover) {
        filter: blur(3px);
        opacity: 0.5;
        transform: scale(0.95) !important;
    }

    #menu-container .menu-btn:hover {
        transform: scale(1.05) !important; 
        z-index: 50; 
        box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5), 
                    0 8px 10px -6px rgba(99, 102, 241, 0.3) !important;
    }

    /* 2. HIỆU ỨNG CHO IDOL CARDS (TRONG TRANG CHI TIẾT NHÓM) */
    .idol-card-item {
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                    filter 0.4s ease, 
                    opacity 0.4s ease, 
                    box-shadow 0.4s ease !important;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
    }
    
    .idol-cards-wrapper:has(.idol-card-item:hover) .idol-card-item:not(:hover) {
        filter: blur(3px);
        opacity: 0.5;
        transform: scale(0.95) !important;
    }

    .idol-card-item:hover {
        transform: scale(1.05) !important;
        z-index: 50 !important;
    }
  </style>
</head>

  <script>
    // --- THAY LINK API CỦA BẠN VÀO ĐÂY ---
    const API_URL = "YOUR_API_URL_HERE";

    function runScript(action, payload = {}) {
        return fetch(API_URL, {
            method: 'POST',
            redirect: 'follow', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: action, payload: payload })
        })
        .then(res => res.json())
        .then(res => {
            if (res.status === 'error') throw new Error(res.message);
            return res.data;
        });
    }

    const formatNum = (num) => num.toLocaleString('en-US');
    
    function animateAllNumbers() {
        const elements = document.querySelectorAll('.animate-num');
        elements.forEach(el => {
            const target = parseFloat(el.getAttribute('data-target')) || 0;
            const duration = 2500; 
            let startTimestamp = null;

            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                const easeProgress = 1 - Math.pow(1 - progress, 3); 
                
                const currentValue = Math.floor(easeProgress * target);
                
                el.innerText = formatNum(currentValue);

                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    el.innerText = formatNum(target); 
                }
            };
            window.requestAnimationFrame(step);
        });
    }

    const DATA_CACHE = {}; 
    window.activeGroupKey = 'main'; 
    let currentMonthValue = ""; 
    let currentDateValue = ""; 

    function initTheme() {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else { document.documentElement.classList.remove('dark'); }
      updateThemeIcon();
    }
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      updateThemeIcon();
    }
    function updateThemeIcon() {
      const icon = document.getElementById('theme-icon');
      if(icon) icon.className = document.documentElement.classList.contains('dark') ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-slate-600';
    }

    document.addEventListener("DOMContentLoaded", function() {
      initTheme();
      showModernLoader();
      let today = new Date();
      let yyyy = today.getFullYear();
      let mm = String(today.getMonth() + 1).padStart(2, '0');
      let dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('date-selector').value = `${yyyy}-${mm}-${dd}`;
      currentDateValue = `${yyyy}-${mm}-${dd}`;
      
      runScript('getAvailableMonths')
        .then(initApp)
        .catch(err => {
            document.getElementById('main-content-area').innerHTML = `<div class="text-center mt-10 text-rose-500 font-bold">Lỗi kết nối API: ${err.message}</div>`;
        });
    });

    function initApp(responseStr) {
      let months = JSON.parse(responseStr);
      let select = document.getElementById('month-selector');
      select.innerHTML = '';
      if (months.length === 0) {
         select.innerHTML = '<option value="">Chưa có dữ liệu</option>';
         document.getElementById('main-content-area').innerHTML = '<div class="text-center mt-10 text-slate-500">Vui lòng tạo Sheet đúng chuẩn</div>';
         return;
      }
      months.forEach(m => {
         let opt = document.createElement('option');
         opt.value = m.value; opt.text = m.label; select.appendChild(opt);
      });
      currentMonthValue = select.value;
      loadMainDashboard(document.querySelectorAll('.menu-btn')[0]);
    }

    function changeMonth() {
      currentMonthValue = document.getElementById('month-selector').value;
      let parts = currentMonthValue.split('.'); 
      let m = String(parts[0]).padStart(2, '0'); let y = parts[1];
      let newDate = `${y}-${m}-01`;
      let sysToday = new Date();
      if (sysToday.getFullYear() == y && (sysToday.getMonth() + 1) == parts[0]) {
          let dd = String(sysToday.getDate()).padStart(2, '0'); newDate = `${y}-${m}-${dd}`;
      }
      document.getElementById('date-selector').value = newDate; currentDateValue = newDate;
      for (let key in DATA_CACHE) delete DATA_CACHE[key]; 
      forceSync(); 
    }

    function changeDate() {
       currentDateValue = document.getElementById('date-selector').value;
       let parts = currentDateValue.split('-');
       let selectedMonth = parseInt(parts[1], 10); let selectedYear = parts[0];
       let newMonthValue = selectedMonth + "." + selectedYear;
       let monthSelect = document.getElementById('month-selector');
       let optionExists = false;
       for(let i=0; i<monthSelect.options.length; i++) {
           if(monthSelect.options[i].value === newMonthValue) { optionExists = true; break; }
       }
       if (optionExists && currentMonthValue !== newMonthValue) {
           currentMonthValue = newMonthValue; monthSelect.value = newMonthValue;
       }
       forceSync();
    }

    function forceSync() {
        for (let key in DATA_CACHE) delete DATA_CACHE[key];
        let btns = document.querySelectorAll('.menu-btn');
        let activeBtn = Array.from(btns).find(b => b.classList.contains('cursor-default')) || btns[0];
        
        if (window.activeGroupKey === 'main') { loadMainDashboard(activeBtn); } 
        else if (window.activeGroupKey === 'congrats') { loadCongratsView(activeBtn); }
        else { loadGroup(window.activeGroupKey, activeBtn); }
    }

      document.querySelectorAll('.menu-btn').forEach(btn => {
        if(btn.innerText.includes("DASHBOARD")) {
           btn.className = 'menu-btn w-full flex items-center px-3 py-2.5 mb-1.5 rounded-xl text-slate-400 border border-slate-700 hover:bg-slate-800 transition-colors duration-200 uppercase font-bold text-xs';
        } else if(btn.innerText.includes("CHÚC MỪNG")) {
           btn.className = 'menu-btn w-full flex items-center px-3 py-2.5 mb-2 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 font-black text-xs shadow-md uppercase transition-colors duration-200';
        } else {
           btn.className = 'menu-btn w-full flex items-center px-3 py-2 mb-1 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors duration-200 text-[11px]';
        }
      });
      if(btnElement.innerText.includes("DASHBOARD")) {
         btnElement.className = 'menu-btn w-full flex items-center px-3 py-2.5 mb-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs shadow-lg uppercase cursor-default';
      } else if(btnElement.innerText.includes("CHÚC MỪNG")) {
         btnElement.className = 'menu-btn w-full flex items-center px-3 py-2.5 mb-2 rounded-xl bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 font-black text-xs shadow-xl uppercase scale-105 cursor-default';

    function loadMainDashboard(btnElement) {
      window.activeGroupKey = 'main'; updateMenuUI(btnElement);
      let displayDate = currentDateValue.split('-').reverse().slice(0, 2).join('/');
      document.getElementById('current-group-title').innerHTML = `<i class="fas fa-chart-line text-slate-400 mr-2"></i> BẢNG TỔNG KPI PASSION STAR - NGÀY ${displayDate}`;
      let cacheKey = 'main_' + currentMonthValue + '_' + currentDateValue;
      if(DATA_CACHE[cacheKey]) { renderMainDashboard(DATA_CACHE[cacheKey]); } 
      else {
         showModernLoader();
         runScript('getDashboardOverview', { monthValue: currentMonthValue, selectedDate: currentDateValue })
            .then(res => { DATA_CACHE[cacheKey] = res; renderMainDashboard(res); })
            .catch(err => { document.getElementById('main-content-area').innerHTML = `<div class="text-center mt-10 text-rose-500 font-bold">Lỗi tải dữ liệu: ${err.message}</div>`; });

        for(let i = headIdx + 1; i < augData.length; i++) {

    function triggerFireworks() {
        if(typeof confetti === 'function') {
            var duration = 2.5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) {
                return clearInterval(interval);
              }
              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    }

    function renderGroupDashboard(responseString) {
      var response = (typeof responseString === 'string') ? JSON.parse(responseString) : responseString;
      let displayDate = currentDateValue.split('-').reverse().slice(0, 2).join('/');
      document.getElementById('current-group-title').innerHTML = `<i class="fas fa-star text-slate-400 mr-2"></i> CHI TIẾT: ${response.groupName} - THÁNG ${currentMonthValue.replace('.', '/')}`;
      var data = response.data; var headers = data[1]; 
      
      let dateIdx = 0; let totalIdx = headers.findIndex(h => h.toUpperCase() === "TOTAL");
      let totalRow = data.find(r => r[0] && r[0].toString().toUpperCase() === "TOTAL");

      if(totalRow && totalIdx > 0) {
        let idols = [];
        for(let c = 1; c < headers.length; c++) {
          if(c === totalIdx || headers[c] === "") continue;
          let val = parseFloat(totalRow[c].toString().replace(/,/g, '')) || 0;
          idols.push({ name: headers[c], oldIdx: c, val: val });
        }
        idols.sort((a,b) => b.val - a.val); let newOrder = [dateIdx];
        idols.forEach(i => newOrder.push(i.oldIdx)); newOrder.push(totalIdx);
        
        let sortedData = [];
        for(let i=0; i<data.length; i++) {
          let oldRow = data[i]; let newRow = [];
          for(let j=0; j<newOrder.length; j++) { newRow.push(oldRow[newOrder[j]] !== undefined ? oldRow[newOrder[j]] : ""); }
          sortedData.push(newRow);
        }
        data = sortedData; headers = data[1];
      }

      const formatShort = (val) => {
          if (!val) return "0";
          let num = parseFloat(val.toString().replace(/,/g, ''));
          if (isNaN(num)) return val;
          if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + "k";
          return num.toLocaleString('en-US');
      };

      let cardsHTML = ''; 
      let groupTotalCoin = "0"; 
      let groupKpiCoin = "0";
      
      let kpiRow = data.find(r => r[0] && r[0].toString().toUpperCase() === "KPI");
      
      let rank = 1;

      for(let r = 2; r < data.length; r++) {
        if(data[r][0] && data[r][0].toString().toUpperCase() === "TOTAL") {
          for(let c = 1; c < headers.length; c++) {
            if(headers[c] === "") continue;
            
            if(headers[c].toUpperCase() === "TOTAL") { 
                groupTotalCoin = data[r][c]; 
                if (kpiRow && kpiRow[c]) groupKpiCoin = kpiRow[c];
            } 
            else { 
                let curVal = data[r][c] || "0";
                let displayVal = curVal;
                let exactCurVal = formatNum(parseFloat(curVal.toString().replace(/,/g, '')) || 0);
                let tooltipText = exactCurVal;
                let isKpiExist = kpiRow && kpiRow[c] && kpiRow[c].toString().trim() !== "";
                
                if (isKpiExist) {
                    let kpiValStr = kpiRow[c];
                    displayVal = formatShort(curVal) + " / " + formatShort(kpiValStr);
                    let exactKpiVal = formatNum(parseFloat(kpiValStr.toString().replace(/,/g, '')) || 0);
                    tooltipText = `${exactCurVal} / ${exactKpiVal}`;
                }

                let cardClasses = "";
                let titleColor = "text-slate-400";
                let valColor = "text-slate-900 dark:text-white";
                let iconHtml = "";
                
                if (rank === 1) { // TOP 1
                    cardClasses = "bg-gradient-to-br from-yellow-50 to-amber-50 dark:from-slate-800 dark:to-slate-800 border-y border-r border-yellow-300 dark:border-yellow-500/50 border-l-[6px] border-l-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.6)]";

                    iconHtml = `<i class="fas fa-crown absolute -right-2 -bottom-2 text-5xl text-yellow-400/20"></i>`;

                    iconHtml = ``;
                }

                let innerGlowClass = rank <= 3 ? "glass-shine" : "";

                cardsHTML += `
                  <div class="idol-card-item relative group cursor-pointer ${cardClasses} rounded-lg min-w-[130px] shrink-0 z-10">
                    
                    <div class="absolute inset-0 overflow-hidden rounded-lg pointer-events-none z-0 ${innerGlowClass}">${iconHtml}</div>
                    
                    <div class="px-3 py-2 relative z-10">
                        <h3 class="${titleColor} text-[10px] font-black uppercase tracking-wider mb-1 drop-shadow-sm flex items-center justify-between gap-2">
                           <span>${headers[c]}</span>
                           ${rank <= 3 ? `<span class="bg-slate-900/80 dark:bg-black/80 text-white px-1.5 py-0.5 rounded text-[8px] tracking-tight border border-white/20 shadow-sm">TOP ${rank}</span>` : ''}
                        </h3>
                        <p class="text-[15px] whitespace-nowrap font-black ${valColor} drop-shadow-sm">${displayVal}</p>
                    </div>
                    
                    <!-- TOOLTIP -->
                    <div class="absolute bottom-[115%] left-1/2 transform -translate-x-1/2 bg-slate-900 dark:bg-black text-white text-[10px] font-bold px-2 py-1.5 rounded shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none whitespace-nowrap z-50 border border-slate-700 flex items-center justify-center">
                       <span>${tooltipText}</span>
                       <div class="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-slate-900 dark:border-t-black"></div>
                    </div>
                  </div>`; 
                rank++;
            }
          } break; 
        }
      }
      
      let groupDisplayVal = groupTotalCoin;
      let exactGroupTotal = formatNum(parseFloat(groupTotalCoin.toString().replace(/,/g, '')) || 0);
      let groupTooltipText = exactGroupTotal;
      
      if (groupKpiCoin && groupKpiCoin.toString().trim() !== "") {
          let exactGroupKpi = formatNum(parseFloat(groupKpiCoin.toString().replace(/,/g, '')) || 0);
          groupDisplayVal = formatShort(groupTotalCoin) + " / " + formatShort(groupKpiCoin);
          groupTooltipText = `${exactGroupTotal} / ${exactGroupKpi}`;
      }
      
      cardsHTML += `
        <div class="relative group cursor-pointer bg-slate-900 dark:bg-black rounded-lg px-3 py-2 border border-yellow-500/50 border-l-[6px] border-l-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.5)] min-w-[140px] shrink-0 transform hover:scale-105 transition-all duration-300 z-10 hover:z-20 overflow-hidden">
          <i class="fas fa-users absolute -right-2 -bottom-2 text-4xl text-yellow-400/10"></i>
          <h3 class="text-yellow-400 text-[10px] font-black uppercase tracking-widest mb-1 drop-shadow-sm">TỔNG NHÓM</h3>
          <p class="text-base whitespace-nowrap font-black text-white drop-shadow-md relative z-10">${groupDisplayVal}</p>
          
          <!-- TOOLTIP NHÓM -->
          <div class="absolute bottom-[115%] left-1/2 transform -translate-x-1/2 bg-yellow-400 text-slate-900 text-[10px] font-black px-2 py-1.5 rounded shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none whitespace-nowrap z-50 border border-yellow-500 flex items-center gap-1.5">
             <i class="fas fa-bullseye text-xs text-rose-600"></i>
             <span>${groupTooltipText}</span>
             <div class="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-yellow-400"></div>
          </div>
        </div>`;

      let tableHTML = `<table class="custom-table text-[11px] text-left text-slate-600 dark:text-slate-300"><thead class="uppercase shadow-sm"><tr>`;
      headers.forEach(h => {
        if(h !== "") { let alignClass = (h === "DATE") ? "text-left" : "text-center"; tableHTML += `<th class="px-2 py-2 font-bold ${alignClass} whitespace-nowrap">${h}</th>`; }
      });
      tableHTML += `</tr></thead><tbody class="bg-white dark:bg-slate-800">`;

      let footerRows = []; 
      for(let i = 2; i < data.length; i++) {
        let row = data[i]; let dateVal = row[0]; if(!dateVal) continue; 
        if(dateVal.toString().toUpperCase() === "TOTAL" || dateVal.toString().toUpperCase() === "KPI" || dateVal.toString().toUpperCase() === "NEED") { footerRows.push({row: row, type: dateVal.toString().toUpperCase()}); continue; }

        tableHTML += `<tr class="hover:bg-indigo-50/40 dark:hover:bg-slate-700/50 transition-colors">`;
        for(let j = 0; j < headers.length; j++) {
          if(headers[j] === "") continue; 
          let cellVal = row[j]; let tdClass = "px-2 py-1.5 whitespace-nowrap";
          if(j === 0) tdClass += " font-semibold text-slate-700 dark:text-slate-200 w-16 text-left"; else tdClass += " text-center";
          if(j > 0 && headers[j].toUpperCase() !== "TOTAL") {
            let valStr = cellVal.toString().trim().toUpperCase(); let numVal = parseFloat(cellVal.toString().replace(/,/g, ''));
            if(valStr === "OFF" || valStr === "NOT DEBUT") { tdClass += " bg-slate-200 dark:bg-slate-600 font-extrabold text-slate-500 dark:text-slate-300 shadow-inner"; } 
            else if (!isNaN(numVal) && numVal > 0) {
              if (numVal >= 100000) tdClass += " bg-rose-500 font-bold text-white shadow-inner";
              else if (numVal >= 50000) tdClass += " bg-cyan-300 dark:bg-cyan-600 font-bold text-slate-900 dark:text-white";
              else if (numVal >= 30000) tdClass += " bg-green-400 dark:bg-green-600 font-bold text-slate-900 dark:text-white";
              else tdClass += " font-medium";
            }
          }
          if(headers[j].toUpperCase() === "TOTAL" && j > 0) tdClass += " font-bold bg-slate-50 dark:bg-slate-700/50 text-indigo-700 dark:text-indigo-300";
          tableHTML += `<td class="${tdClass}">${cellVal}</td>`;
        }
        tableHTML += `</tr>`;
      }
      tableHTML += `</tbody><tfoot class="shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">`;
      footerRows.forEach(f => {
          let bgClass = f.type === "TOTAL" ? "bg-indigo-100 dark:bg-indigo-900/50 text-indigo-800 dark:text-indigo-200 font-bold" : (f.type === "KPI" ? "bg-slate-100 dark:bg-slate-700 font-semibold text-slate-700 dark:text-slate-300" : "bg-red-50 dark:bg-red-900/40 font-bold text-red-600 dark:text-red-400");
          tableHTML += `<tr>`;
          for(let j = 0; j < headers.length; j++) {
            if(headers[j] === "") continue; 
            let tdClass = `px-2 py-2 whitespace-nowrap ${bgClass}`;
            if(j === 0) tdClass += " text-left"; else tdClass += " text-center";
            tableHTML += `<td class="${tdClass}">${f.row[j]}</td>`;
          }
          tableHTML += `</tr>`;
      });
      tableHTML += `</tfoot></table>`;
      
      let finalGroupHTML = `
        <div class="animate-fade-in flex flex-col h-full gap-3 min-h-0">
            <div class="idol-cards-wrapper flex gap-4 overflow-x-auto overflow-y-visible pb-4 pt-10 -mt-6 shrink-0 min-h-[90px] items-end px-2">${cardsHTML}</div>
            <div class="flex-1 min-h-0 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col overflow-hidden">
              <div class="flex-1 overflow-auto p-0 bg-slate-50 dark:bg-slate-800 relative">${tableHTML}</div>
            </div>
        </div>
      `;
      document.getElementById('main-content-area').innerHTML = finalGroupHTML;
    }
  </script>
</body>
</html>
