<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="52%" stop-color="#0f2354"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0a1931"/>
    </linearGradient>
    <clipPath id="fullSquare">
      <rect width="512" height="512" rx="0"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Full-bleed Background (iOS applies squircle mask automatically) -->
  <g clip-path="url(#fullSquare)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <circle cx="95" cy="95" r="170" fill="#38bdf8" opacity="0.16"/>
    <circle cx="430" cy="415" r="190" fill="#ef4444" opacity="0.16"/>
  </g>

  <!-- Back MB Card -->
  <g transform="translate(94, 92) rotate(-8 160 100)" filter="url(#glow)">
    <rect x="0" y="0" width="308" height="196" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.34)" stroke-width="3.5"/>
    <rect x="28" y="34" width="56" height="40" rx="9" fill="#fbbf24" opacity="0.95"/>
    <!-- MB Red Star -->
    <polygon points="252,28 262,54 290,54 267,70 276,97 252,81 228,97 237,70 214,54 242,54" fill="#ef4444"/>
  </g>

  <!-- Foreground Wallet Body -->
  <g filter="url(#glow)">
    <rect x="80" y="172" width="352" height="240" rx="46" fill="#0b1224" stroke="url(#walletGrad)" stroke-width="7"/>
    <rect x="98" y="190" width="316" height="204" rx="34" fill="#131e38"/>
    <!-- Emerald Accent Strip -->
    <rect x="122" y="218" width="146" height="15" rx="7.5" fill="#10b981"/>
    <rect x="122" y="246" width="92" height="10" rx="5" fill="#64748b" opacity="0.6"/>
    <!-- Wallet Clasp -->
    <rect x="302" y="254" width="142" height="76" rx="28" fill="url(#walletGrad)"/>
    <circle cx="344" cy="292" r="15" fill="#060913"/>
    <!-- Bold Currency Emblem -->
    <text x="140" y="360" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="82" fill="#fbbf24">₫</text>
  </g>
</svg>
