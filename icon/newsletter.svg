<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mailGrad1" x1="150" y1="150" x2="1050" y2="1050" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="300" y1="200" x2="900" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="600" y1="100" x2="600" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background Glow Circle -->
  <circle cx="600" cy="600" r="500" fill="url(#glowGrad)" filter="blur(60px)" opacity="0.3"/>
  <!-- Envelope Body -->
  <rect x="220" y="380" width="760" height="520" rx="48" fill="url(#mailGrad1)"/>
  <!-- Newsletter Paper sliding out -->
  <rect x="300" y="220" width="600" height="420" rx="24" fill="url(#paperGrad)"/>
  <rect x="360" y="280" width="300" height="32" rx="16" fill="#6366F1"/>
  <rect x="360" y="340" width="480" height="18" rx="9" fill="#94A3B8"/>
  <rect x="360" y="375" width="420" height="18" rx="9" fill="#CBD5E1"/>
  <rect x="360" y="410" width="450" height="18" rx="9" fill="#CBD5E1"/>
  <!-- Envelope Flap Front -->
  <path d="M220 440 L600 680 L980 440 V850 C980 876 958 898 932 898 H268 C242 898 220 876 220 850 Z" fill="#4F46E5" opacity="0.95"/>
  <path d="M220 400 L600 650 L980 400" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Sparkles -->
  <circle cx="200" cy="280" r="24" fill="#38BDF8"/>
  <circle cx="1000" cy="300" r="32" fill="#F43F5E"/>
  <circle cx="950" cy="780" r="20" fill="#FACC15"/>
</svg>
