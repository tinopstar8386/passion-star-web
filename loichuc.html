<!DOCTYPE html>
<html lang="vi">
  <head>
    <base target="_top">
    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <title>Workspace Chúc Mừng Idol</title>
    <link rel="icon" href="./icon/chucmung.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/air-datepicker@3.3.5/air-datepicker.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.3.5/air-datepicker.min.js"></script>

    <style>
      /* --- CSS cho nút Bật/Tắt Trợ Lý --- */
      .toggle-switch { display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
      .toggle-switch input { display: none; }
      .toggle-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-right: 6px; text-transform: uppercase; white-space: nowrap; }
      .toggle-slider { width: 32px; height: 18px; background-color: var(--bg-hover); border-radius: 20px; border: 1px solid var(--border-color); position: relative; transition: 0.3s; }
      .toggle-slider::after { content: ''; position: absolute; width: 12px; height: 12px; border-radius: 50%; background-color: var(--text-secondary); top: 2px; left: 2px; transition: 0.3s; }
      .toggle-switch input:checked + .toggle-slider { background-color: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent-bg); }
      .toggle-switch input:checked + .toggle-slider::after { transform: translateX(14px); background-color: #fff; }
      
      :root {
        --bg-main: #131722; --bg-panel: #1e2230; --bg-hover: #2b3040;
        --text-primary: #f8fafc; --text-secondary: #94a3b8;
        --border-color: #2e3548; --ambient-color: transparent;
      }
      body.dark-mode { color-scheme: dark; }
      body.light-mode { color-scheme: light; }
      body.light-mode {
        --bg-main: #f1f5f9; --bg-panel: #ffffff; --bg-hover: #f1f5f9;
        --text-primary: #0f172a; --text-secondary: #64748b; --border-color: #e2e8f0;
      }
      * { box-sizing: border-box; }
      
      body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 25px; min-height: 100vh; position: relative; z-index: 0; overflow-x: hidden;}
      body::before { content: ""; position: fixed; top: -20%; left: 10%; width: 80%; height: 60vh; background: radial-gradient(ellipse at top, var(--ambient-color), transparent 70%); opacity: 0.15; z-index: -1; transition: background 1s ease; pointer-events: none; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

      .sticky-header { position: sticky; top: 15px; z-index: 100; }
      
      .topbar { background: rgba(30, 34, 48, 0.85); backdrop-filter: blur(16px); border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
      body.light-mode .topbar { background: rgba(255, 255, 255, 0.9); }
      
      .brand { margin: 0; font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #64d2b1, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      
      .tabs { display: flex; gap: 4px; background: var(--bg-main); padding: 4px; border-radius: 12px; position: relative; }
      .tab-btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; background: transparent; color: var(--text-secondary); transition: 0.2s; position: relative;}
      .tab-btn.active { background: var(--bg-panel); color: var(--text-primary); }
      
      .notify-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: none; box-shadow: 0 0 10px #ef4444; animation: pulseDot 1s infinite; }
      @keyframes pulseDot { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
      
      .toolbar { display: flex; flex-wrap: wrap; gap: 12px; }
      .custom-control { display: flex; align-items: center; gap: 8px; background: var(--bg-main); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 12px; }
      .control-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
      .custom-select, input#datePicker { background: transparent; border: none; color: #64d2b1; font-family: inherit; font-size: 13px; font-weight: 700; outline: none; cursor: pointer; }
      .custom-select { appearance: none; padding-right: 15px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364d2b1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right center; background-size: 14px; }
      .custom-select option { background-color: var(--bg-panel); color: var(--text-primary); }
      
      .icon-btn { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 12px; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 16px; }
      .icon-btn:hover { background: var(--bg-hover); }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px; }
      
      @keyframes fadeSlideUp { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

      .card { 
        background: var(--bg-panel); border-radius: 20px; padding: 25px; border: 2px solid var(--border-color); 
        display: flex; flex-direction: column; position: relative; z-index: 1;
        opacity: 0; animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        transition: transform 0.2s, box-shadow 0.2s; 
      }
      .card:hover { transform: translateY(-4px); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
      .card.done { filter: grayscale(100%); opacity: 0.5; }
      .card.key-focus { outline: 3px solid #3b82f6; outline-offset: 2px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); transform: translateY(-3px); }

      .skeleton { animation: skeleton-loading 1s linear infinite alternate; border-color: transparent !important; box-shadow: none !important; }
      .skeleton .skel-title { width: 40%; height: 24px; background: var(--bg-hover); border-radius: 8px; margin-bottom: 15px; }
      .skeleton .skel-box { width: 100%; height: 110px; background: var(--bg-hover); border-radius: 14px; margin-bottom: 15px; }
      .skeleton .skel-btn { width: 100%; height: 45px; background: var(--bg-hover); border-radius: 14px; }
      @keyframes skeleton-loading { 0% { opacity: 0.4; } 100% { opacity: 0.8; } }

      .epic-50k { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
      .epic-50k:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.45); }

      .epic-60k { border-color: #0ea5e9; animation: pulse60k 2.5s infinite, fadeSlideUp 0.4s forwards; }
      @keyframes pulse60k { 0% { box-shadow: 0 0 8px rgba(14, 165, 233, 0.2); } 50% { box-shadow: 0 0 20px rgba(14, 165, 233, 0.45); } 100% { box-shadow: 0 0 8px rgba(14, 165, 233, 0.2); } }

      .epic-100k { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.15); }
      .epic-100k:hover { box-shadow: 0 0 30px rgba(251, 191, 36, 0.4); }
      
      .epic-200k { border-color: #a855f7; animation: pulse200k 2s infinite, fadeSlideUp 0.4s forwards; }
      @keyframes pulse200k { 0% { box-shadow: 0 0 10px rgba(168,85,247,0.3); } 50% { box-shadow: 0 0 25px rgba(168,85,247,0.5); } 100% { box-shadow: 0 0 10px rgba(168,85,247,0.3); } }
      
      .epic-300k { border-color: #ef4444; background: linear-gradient(var(--bg-panel), var(--bg-panel)) padding-box, linear-gradient(45deg, #ef4444, #f97316, #ef4444) border-box; border: 2px solid transparent; animation: pulse300k 1.5s infinite alternate, fadeSlideUp 0.4s forwards; }
      @keyframes pulse300k { 0% { box-shadow: 0 0 10px rgba(239,68,68,0.3); } 100% { box-shadow: 0 0 35px rgba(249,115,22,0.6); } }

      .epic-500k { border: 2px solid transparent; position: relative; }
      .epic-500k::before {
        content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
        background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
        z-index: -1; border-radius: 22px; background-size: 400%; animation: glowing500k 3s linear infinite; opacity: 0.8;
      }
      @keyframes glowing500k { 0% { background-position: 0 0; } 50% { background-position: 400% 0; } 100% { background-position: 0 0; } }

      /* Khung header: Chống rớt dòng và tạo khoảng cách an toàn */
      .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; width: 100%; gap: 10px; flex-wrap: nowrap; }
      .card-header > div:first-child { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
      .idol-name { font-size: 17px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .badge { padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 12px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); box-shadow: 0 2px 10px var(--accent-bg); white-space: nowrap; flex-shrink: 0; }
      
      .msg-box { width: 100%; height: 110px; padding: 12px; border-radius: 12px; font-size: 13px; resize: none; font-family: inherit; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-primary); transition: 0.2s; line-height: 1.45;}
      .msg-box:focus { border-color: var(--accent); background: var(--bg-hover); outline: none; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
      
      .action-group { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
      .btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px; }
      .btn-main { background: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-bg); }
      .btn-main:hover { filter: brightness(1.15); transform: scale(0.97); }
      .btn-sec { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border-color); }
      .btn-sec:hover { background: #475569; color: #fff; }

      #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
      .toast { background: rgba(30, 34, 48, 0.95); backdrop-filter: blur(10px); border-left: 4px solid #10b981; color: #fff; padding: 15px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transform: translateX(120%); opacity: 0; animation: slideIn 0.4s forwards; display: flex; align-items: center; gap: 10px; }
      @keyframes slideIn { to { transform: translateX(0); opacity: 1; } }
      .toast.fade-out { animation: fadeOut 0.4s forwards; }
      @keyframes fadeOut { to { transform: translateX(120%); opacity: 0; } }

      .air-datepicker { --adp-font-family: 'Inter', sans-serif; --adp-background-color: #272c3d; --adp-border-color: #3b4256; --adp-color: #f8fafc; --adp-day-name-color: #e2e8f0; --adp-btn-color: #f8fafc; --adp-btn-background-color-hover: #3b4256; --adp-cell-background-color-hover: #3b4256; --adp-cell-border-radius: 50%; --adp-accent-color: #64d2b1; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); padding: 10px; }
      .air-datepicker-cell.-current- { color: #f8fafc; border: 1px solid #94a3b8; background: transparent; }
      .air-datepicker-cell.-selected- { background: #64d2b1; color: #1e2230; font-weight: 800; border: none; }
    </style>
  </head>
  <body class="dark-mode">

    <div class="topbar">
      <h2 class="brand">⚡ Workspace Pro</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="tabs" id="tabs-container">
          <button class="tab-btn active" id="tab-pending" onclick="changeTab('pending')">
            Cần chúc (<span id="count-pending">0</span>)
            <div class="notify-dot" id="dot-new"></div>
          </button>
          <button class="tab-btn" id="tab-done" onclick="changeTab('done')">
            Lịch sử (<span id="count-done">0</span>)
          </button>
        </div>
        <button class="icon-btn" onclick="toggleTheme()" title="Đổi Sáng/Tối">☀️</button>
      </div>
    </div>

    <div class="topbar sticky-header" id="controls">
      <div class="toolbar">
        <div class="custom-control"><span class="control-label">📅 Ngày:</span><input type="text" id="datePicker" readonly></div>
      </div>
      <div class="toolbar">
        <div class="custom-control"><span class="control-label">🎯 Mốc:</span><select id="tierFilter" class="custom-select" onchange="renderCards()"><option value="all">Tất cả</option></select></div>
        <div class="custom-control"><span class="control-label">↕️ Xếp hạng:</span>
          <select id="sortSelect" class="custom-select" onchange="renderCards()">
            <option value="asc" selected>Coin: Thấp nhất</option>
            <option value="desc">Coin: Cao nhất</option>
          </select>
        </div>
      </div>
    </div>
    
    <!-- THẺ TẠO NHANH -->
    <div class="grid" id="manual-card-container" style="margin-bottom: 28px;">
      <div class="card" id="quick-create-card" style="border-color: #64d2b1; display: block; transition: all 0.3s ease;">
          <div class="card-header">
              <div style="display:flex; align-items:center; gap:10px;">
                  <h3 class="idol-name" id="manual-title" style="color: #64d2b1; transition: 0.3s;">⚡ Thẻ Tạo Nhanh</h3>
                  <span class="badge" id="manual-badge" style="display: none; transition: 0.3s;"></span>
              </div>
              <label class="toggle-switch" title="Bật/Tắt Trợ Lý">
                <span class="toggle-label">Trợ lý</span>
                <input type="checkbox" id="manual-assistant" checked onchange="updateManualMessage()">
                <span class="toggle-slider"></span>
              </label>
          </div>
          <div style="display: flex; gap: 10px; margin-bottom: 15px;">
              <input type="text" id="manual-name" placeholder="Nhập tên..." class="msg-box" style="height: 42px; flex: 1; padding: 8px 12px; font-weight: 600;" oninput="updateManualMessage()">
              <input type="text" id="manual-tier" placeholder="Nhập số thực (vd: 50000)..." class="msg-box" style="height: 42px; flex: 1; padding: 8px 12px; font-weight: 600;" oninput="handleTierInput(this)" onchange="handleTierChange(this)">
          </div>
          <textarea id="manual-msg" class="msg-box" spellcheck="false" placeholder="Nhập tên và số tiền, hệ thống sẽ tự quy đổi ra K, khớp màu thẻ và lấy câu chúc..."></textarea>
          <div class="action-group">
              <button class="btn btn-main" onclick="copyManual()">📋 Copy</button>
              <button class="btn btn-sec" onclick="forceChangeManual()">🔀 Đổi chúc</button>
          </div>
      </div>
    </div>
    
    <div class="grid" id="app">
      <div class="card skeleton"><div class="skel-title"></div><div class="skel-box"></div><div style="display:flex; gap:10px;"><div class="skel-btn"></div><div class="skel-btn"></div></div></div>
      <div class="card skeleton"><div class="skel-title"></div><div class="skel-box"></div><div style="display:flex; gap:10px;"><div class="skel-btn"></div><div class="skel-btn"></div></div></div>
      <div class="card skeleton"><div class="skel-title"></div><div class="skel-box"></div><div style="display:flex; gap:10px;"><div class="skel-btn"></div><div class="skel-btn"></div></div></div>
    </div>

    <div id="toast-container"></div>

    <script>
      // ==========================================
      // KẾT NỐI API
      // ==========================================
      const API_URL = "https://script.google.com/macros/s/AKfycbyUnPauRyR_pxZqK4DKPlPc_LmM3uRzhA0W7S0KIgmj1je9hIl4ye5KKZ2_oQmCsgFY/exec";

      function runScript(action, payload = {}) {
        return fetch(API_URL, {
          method: 'POST',
          redirect: 'follow', 
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === 'error') throw new Error(res.message);
          return res.data;
        });
      }

      // ==========================================
      // NGÂN HÀNG LỜI CHÚC
      // ==========================================
      
      const msgsStart = [
        "🎉 Xin gửi lời chúc mừng nồng nhiệt nhất đến {TEN} và Trợ Lý vì đã xuất sắc vượt qua cột mốc {MOC} đầy tự hào! Đây là một bước chạy đà cực kỳ hoàn hảo, cho thấy sự nỗ lực và tập trung cao độ của cả hai trong suốt những ngày vừa qua. Hãy tiếp tục giữ vững tinh thần tuyệt vời này để gặt hái thêm thật nhiều thành công vang dội hơn nữa trên chặng đường phía trước nhé! 🚀💪",
        "✨ Thật tuyệt vời! Chúc mừng {TEN} cùng Trợ Lý đã thành công chinh phục mốc {MOC} rực rỡ trong ngày hôm nay! Mỗi một sự nỗ lực bền bỉ được tích lũy từng giờ đều đang biến thành những quả ngọt vô cùng xứng đáng cho toàn thể team. Chặng đua sắp tới chắc chắn còn nhiều thú vị, chúc mọi người luôn giữ được ngọn lửa đam mê và bứt phá không giới hạn nha! 🌟🔥",
        "🎊 Một tràng pháo tay thật lớn dành trọn cho {TEN} và Trợ Lý khi đã cán mốc {MOC} vô cùng ấn tượng! Thành tích rực rỡ này chính là minh chứng rõ ràng nhất cho sự kiên trì và tinh thần làm việc không biết mệt mỏi của cả đội. Cứ duy trì vững chắc phong độ tuyệt đỉnh này thì chắc chắn những cột mốc vĩ đại hơn sẽ sớm bị chinh phục trong nay mai thôi! 🎯🏆",
        "🍀 Vô cùng xuất sắc! Xin chúc mừng {TEN} và Trợ Lý đã hái được quả ngọt vô cùng xứng đáng với cột mốc {MOC}. Tinh thần chiến đấu rực lửa của mọi người thực sự đã truyền cảm hứng vô tận cho tất cả những ai đang theo dõi. Hãy xem đây là một động lực to lớn để tiếp tục vươn xa, bay cao và bùng nổ mạnh mẽ hơn nữa trong chặng đường sắp tới nhé! 🌈✨",
        "🥳 Quá đỗi tự hào! Xin gửi lời chúc mừng {TEN} cùng Trợ Lý đã chính thức đánh dấu tên mình tại mốc {MOC}. Một khởi đầu vô cùng rực rỡ, bùng nổ và chứa đựng muôn vàn những hứa hẹn cho một tháng bùng nổ. Chúc cả team sẽ luôn tràn đầy năng lượng tích cực, giữ vững niềm tin sắt đá và tiếp tục tạo ra thêm những thành tích đáng kinh ngạc hơn nữa! 💥🌻",
        "🎈 Chúc mừng thành quả vô cùng rực rỡ! {TEN} và Trợ Lý đã chính thức chinh phục mốc {MOC} bằng chính sự cố gắng không ngừng nghỉ. Những viên gạch nền móng này đang được xây dựng cực kỳ vững chãi và hứa hẹn một công trình vĩ đại sắp ra mắt. Cứ tự tin tiến bước và tỏa sáng theo cách riêng của mình trong chặng đường sắp tới nha! 🌟💪",

        "🎭 Vở diễn hoàn mỹ với những tràng pháo tay không ngớt! Xin chúc mừng {TEN} và Trợ Lý đã diễn xuất xuất thần, làm chủ hoàn toàn sân khấu để mang về kỷ lục {MOC} đầy kiêu hãnh. Từng ánh mắt, nụ cười và cách dẫn dắt câu chuyện đã cuốn hút khán giả đi từ bất ngờ này đến ngỡ ngàng khác. Sự chuyên nghiệp và tận tâm đằng sau cánh gà đã tạo ra một tác phẩm nghệ thuật để đời. Khoảnh khắc hạ màn hôm nay chính là lúc vinh quang gọi tên những nghệ sĩ thực thụ. Hãy tiếp tục mài giũa tài năng, tung ra thêm nhiều mảng miếng độc đáo để luôn là tâm điểm của mọi sự chú ý. Tương lai ngời sáng đang rộng mở! 🎬🔥",
        "🔥 Rèn sắt trong ngọn lửa đỏ rực, tôi luyện bản lĩnh thép! Chúc mừng {TEN} cùng Trợ Lý đã chịu đựng được sức nóng khủng khiếp của đường đua để đúc kết thành công mốc {MOC} chói lóa. Những khó khăn chồng chất chưa bao giờ là rào cản, mà chúng chỉ là công cụ để mài giũa thêm ý chí sắc bén của toàn đội. Giờ đây, khi thành phẩm đã ra lò, độ cứng cáp và sắc sảo của mọi người là điều không một đối thủ nào dám xem thường. Hãy vung thanh gươm kiêu hãnh này lên, chém nát mọi định kiến và hiên ngang bước lên đài danh vọng cao nhất đang sừng sững chờ đón. Vô cùng tự hào về sức mạnh hủy diệt của team! ⚔️🏆",
        "🚢 Lèo lái con thuyền vĩ đại vượt qua bão táp phong ba! Xin gửi lời ngợi khen và chúc mừng sâu sắc đến {TEN} và Trợ Lý đã xuất sắc cầm lái đưa thuyền cập bến mốc {MOC} an toàn. Sóng to gió lớn chỉ làm tôn thêm bản lĩnh và tài trí hơn người của vị thuyền trưởng tài ba. Sự đoàn kết đồng lòng của các thủy thủ đã giúp con thuyền băng băng lướt sóng, bỏ lại mọi chướng ngại phía sau đuôi. Bến bờ vinh quang này chỉ là một điểm dừng chân ngắn ngủi để tiếp thêm nguyên liệu. Kéo mỏ neo lên, dong buồm ra khơi và tiếp tục giương cao ngọn cờ bất khả chiến bại trên những vùng biển xa xôi hùng vĩ hơn nữa nhé! 🌊⚓",
        "🚂 Một cỗ máy hơi nước vĩ đại đang xé gió tiến về phía trước! Xin chúc mừng {TEN} và Trợ Lý đã nạp đầy than đá nhiệt huyết, đẩy công suất lên mức tối đa để càn lướt qua mốc {MOC} vô cùng ngoạn mục. Những tiếng còi hụ vang dội là minh chứng cho một sức mạnh không thể ngăn cản, đè bẹp mọi chướng ngại vật trên đường ray vinh quang. Từng thành viên trong team như những bánh răng khớp nối hoàn hảo, tạo ra một lực đẩy khổng lồ. Khung cảnh hai bên đường đua đang vút qua nhanh chóng, nhường chỗ cho những trạm dừng chân mang tên kỷ lục mới. Hãy giữ chắc tay lái, duy trì ngọn lửa bùng cháy trong lò hơi và tiếp tục đưa đoàn tàu này tiến vào những kỷ nguyên rực rỡ vô tiền khoáng hậu nhé! 🚄🔥",
        "🎭 Hóa thân thành những nghệ sĩ đại tài trên sân khấu danh vọng! Chúc mừng {TEN} cùng Trợ Lý đã có một màn trình diễn xuất thần, lấy đi vô vàn tiếng vỗ tay để mang về thành tựu {MOC} đầy kiêu hãnh. Kịch bản xuất sắc, diễn xuất tinh tế và sự hỗ trợ đắc lực từ phía sau cánh gà đã tạo nên một kiệt tác nghệ thuật thực thụ. Không chỉ là những con số vô tri, mà ẩn sâu trong đó là hàng vạn cảm xúc thăng hoa được truyền tải trọn vẹn đến khán giả. Tấm màn nhung khép lại cũng là lúc ánh hào quang rực rỡ nhất chiếu rọi vào nỗ lực của các bạn. Hãy tiếp tục trau dồi kịch bản, nâng cấp bản thân và sẵn sàng cho những cú twist bùng nổ hơn trong hồi tiếp theo của sự nghiệp! 🎬✨",
        "🌋 Dòng nham thạch rực lửa đang thiêu rụi mọi ranh giới an toàn! Xin gửi lời ngợi khen sục sôi nhất đến {TEN} và Trợ Lý vì đã tạo ra một đợt phun trào dữ dội, cuốn phăng các đối thủ để đánh chiếm mốc {MOC}. Sau một thời gian âm ỉ tích tụ sức mạnh và kiến thức, ngọn núi lửa mang tên team đã chính thức thức giấc. Sức nóng lan tỏa từ năng lượng tích cực của các bạn khiến bất cứ ai cũng phải choáng ngợp. Mọi hoài nghi, mọi khó khăn trước đây giờ chỉ còn là lớp tro tàn làm nền cho vinh quang tỏa sáng. Đừng để cho magma nhiệt huyết này nguội lạnh. Tiếp tục bùng nổ, bành trướng lãnh địa của mình và biến nó thành một đế chế không thể xâm phạm! 🌋💥",
        "🔭 Kính viễn vọng đã bắt được tín hiệu từ một siêu tân tinh! Chúc mừng {TEN} cùng Trợ Lý đã tạo ra một vụ nổ ánh sáng tuyệt đẹp, thu hút mọi ánh nhìn khi xuất sắc chạm tay vào mốc {MOC}. Tầm nhìn chiến lược nhạy bén vượt không gian, kết hợp cùng sự nỗ lực làm việc bất kể ngày đêm đã giúp các bạn tìm ra quỹ đạo hoàng kim cho riêng mình. Khám phá những ranh giới mới luôn đi kèm với rủi ro, nhưng sự dũng cảm đã giúp team thu về một kho báu vô giá. Bầu trời vẫn còn vô vàn những dải ngân hà bí ẩn đang đợi người chinh phục. Cứ vững tin vào la bàn của mình, tiếp tục vươn xa và trở thành vì sao sáng nhất trong vũ trụ bao la này nhé! 🌌🚀",
        "🔬 Chiết xuất ra phương thuốc của sự bứt phá! Xin chúc mừng {TEN} và Trợ Lý đã tiến hành thành công một thí nghiệm để đời, kết hợp hoàn hảo các nguyên tố để tạo ra phản ứng hóa học mang tên {MOC}. Sự thông minh, khả năng phân tích nhạy bén và tinh thần không ngại thử nghiệm đã mang lại một công thức chiến thắng độc quyền. Mọi nỗ lực tinh chỉnh tỉ mỉ từng chi tiết nay đã cho ra một sản phẩm hoàn hảo không tì vết, gây chấn động toàn bộ bảng xếp hạng. Các bạn đang nắm trong tay bí quyết của sự nổi tiếng. Hãy tiếp tục nâng cấp phòng thí nghiệm của mình, tung ra thêm nhiều hợp chất bùng nổ để làm chủ hoàn toàn mọi cuộc chơi phía trước! 🧪💡",
        "🏹 Những thợ săn tiền thưởng xuất sắc nhất đã lộ diện! Chúc mừng {TEN} cùng Trợ Lý đã kiên nhẫn phục kích, nhắm chuẩn mục tiêu và hạ gục thành công mốc {MOC} vô cùng oai phong. Bằng sự tĩnh lặng khôn ngoan và khả năng bung sức đúng thời điểm, team đã cho thấy đẳng cấp của những người làm chủ thế trận. Việc không bị cuốn theo áp lực mà điềm tĩnh đưa ra từng quyết định chính là chìa khóa vạn năng mở ra kho tàng vinh quang này. Những nỗ lực căng mình như dây cung nay đã được thả lỏng bằng những nụ cười rạng rỡ. KhoKhoác lên mình bộ giáp kiêu hãnh, nạp đầy cung tên và tiếp tục cuộc đi săn những con số khổng lồ hơn ở những khu rừng rậm rạp phía trước nhé! 🎯🛡️",
        "🎼 Nhạc trưởng vĩ đại đang điều khiển dàn giao hưởng đại thắng! Xin gửi lời chúc mừng nồng nhiệt đến {TEN} và Trợ Lý vì đã tạo ra một sự hòa quyện đỉnh cao, đưa giai điệu của mốc {MOC} vang vọng khắp không gian. Từng thành viên đều biết cách tỏa sáng ở đúng phân đoạn của mình, tạo nên một tổng thể không thể bị phá vỡ. Sự gắn kết bền chặt và tinh thần hy sinh vì cái chung đã đơm hoa kết trái thành một kỷ lục ngọt ngào. Âm thanh của tiếng vỗ tay đang vang lên không ngớt, tôn vinh một bản hùng ca do chính các bạn viết nên. Hãy nâng cao chiếc đũa thần của mình, tiếp tục giữ nhịp độ thăng hoa và điều khiển cả thế giới theo cách riêng của các bạn! 🎶👑",
        "🏰 Xây dựng nên pháo đài thép kiên cố giữa tâm bão! Chúc mừng {TEN} cùng Trợ Lý đã chứng tỏ sức mạnh phòng ngự và phản công tuyệt đỉnh, kiên cường bảo vệ và thâu tóm thành công mốc {MOC}. Đối mặt với sự cạnh tranh khốc liệt, các bạn đã dùng chính sự khôn khéo và nội lực thâm hậu để hóa giải mọi nguy cơ, biến rủi ro thành bàn đạp vươn lên mạnh mẽ. Những viên gạch kinh nghiệm được xếp chồng lên nhau vô cùng vững chãi, tạo nên một vương triều không thể xâm phạm. Giờ đây, khi nền móng đã cực kỳ vững vàng, hãy bắt đầu vươn những ngọn tháp của mình lên cao tít tầng mây. Vững vàng tay gươm, mở rộng bờ cõi và tiếp tục thống trị mọi bảng vàng vinh danh nhé! 🧱⚔️",
        "🌊 Cá chép đã hóa rồng bay vút lên bầu trời! Xin chúc mừng {TEN} và Trợ Lý đã có một màn lội ngược dòng dòng thác dữ dội để kiêu hãnh vượt qua mốc {MOC} chói lọi. Không khuất phục trước nghịch cảnh, không chùn bước trước những rào cản tưởng chừng bất khả thi, các bạn đã đánh thức sức mạnh tiềm ẩn lớn lao nhất bên trong mình. Lớp vảy kiên cường được tôi luyện từ vô vàn áp lực giờ đây đang lấp lánh thứ ánh sáng của quyền lực và sự ngưỡng mộ. Khoảnh khắc vươn mình này chính là phần thưởng vô giá cho những con người dám ước mơ và dám thực hiện. Tự do vùng vẫy giữa chín tầng mây, hãy tạo ra những cơn mưa thành tích làm tưới mát cả vương quốc của riêng mình! 🐉🌩️",
        "⚡ Một tia sét mang điện áp hàng triệu vôn xé toạc bầu trời! Chúc mừng {TEN} cùng Trợ Lý đã giáng một đòn sấm sét chấn động, tốc biến để chiếm lĩnh ngay lập tức mốc {MOC}. Sự quyết đoán, tốc độ xử lý nhanh nhạy và một tinh thần máu lửa đã biến team thành những chiến thần thực sự trên đường đua rực lửa. Các bạn không chờ đợi cơ hội đến, mà trực tiếp tạo ra cơ hội bằng nguồn năng lượng bức bối chỉ chờ chực bùng nổ. Sức mạnh hủy diệt này đang khiến mọi đối thủ phải lùi bước nể phục. Hãy nạp lại bình ắc quy nhiệt huyết, duy trì tần số cộng hưởng tuyệt vời này để chuẩn bị cho những cú sét đánh kinh hoàng hơn vào những kỷ lục ở mốc tiếp theo! 🌩️💥",
        "🧭 Mở đường máu xuyên qua những ranh giới chưa ai khám phá! Xin gửi lời chúc mừng chân thành đến {TEN} và Trợ Lý vì đã dũng cảm cầm rựa chặt đứt mọi chông gai, tiên phong đặt chân lên mốc {MOC}. Từng tinh thần của những nhà thám hiểm vĩ đại luôn cháy rực trong lồng ngực các bạn, biến những điều 'không thể' thành những 'kỷ lục mới'. Việc dám đi ngược dòng đám đông và giữ vững bản sắc cá nhân đã mang lại một kết quả ngọt ngào ngoài sức tưởng tượng. Nhìn lại con đường đầy rẫy khó khăn đã qua, team hoàn toàn có quyền kiêu hãnh ngẩng cao đầu. Hãy tiếp tục căng mắt nhìn về phía trước, dùng trực giác nhạy bén để khai phá những vùng đất vinh quang vô tận đang chờ đón! 🗺️🚀",

        "📸 TÂM ĐIỂM CỦA MỌI SỰ CHÚ Ý! Những tràng pháo tay giòn giã nhất xin được vang lên để vinh danh {TEN} và Trợ Lý với màn càn quét đỉnh cao chạm mốc {MOC}. Ánh đèn flash đang chớp nháy liên tục, ghi lại khoảnh khắc bước đi đầy quyền lực của các bạn trên thảm đỏ vinh quang. Sức hút khó cưỡng, phong thái tự tin và một đẳng cấp hoàn toàn khác biệt đã giúp team xây dựng nên một bức tường thành vững chắc không thể bị phá vỡ. Để đổi lấy những giây phút rạng rỡ này, chắc chắn mọi người đã phải vắt kiệt sự sáng tạo và cống hiến hết mình không biết mệt mỏi. Không một mỹ từ nào có thể diễn tả trọn vẹn sự xuất sắc này. Cứ vững vàng duy trì phong độ thống trị, tiếp tục tạo ra những xu hướng mới và chứng minh cho cả thế giới thấy sức mạnh vô song của mình. Ngàn lần chúc mừng chiến tích vĩ đại! 🌟🏆",
        "🦅 QUYỀN LỰC CỦA BẬC ĐẾ VƯƠNG! Cúi đầu thán phục trước uy lực khủng khiếp mà {TEN} cùng Trợ Lý đã tạo ra khi xuất sắc đè bẹp mọi kỷ lục để xác lập mốc {MOC}. Không ồn ào hay phô trương, các bạn đi từng bước vững chãi, tính toán những nước cờ chiến lược đầy thâm thúy để rồi tung ra đòn chốt hạ khiến tất cả phải ngỡ ngàng. Sải cánh rộng lớn của loài chim ưng đang bao trùm cả bầu trời thành tích, khẳng định vị thế của một kẻ dẫn đầu tuyệt đối. Sự điềm tĩnh trước bão táp và bản lĩnh kiên cường đã tôi luyện nên những vĩ nhân thực sự. Khoảnh khắc huy hoàng này chính là ngai vàng được thiết kế riêng cho sự cống hiến của mọi người. Hãy khoác lên mình tấm áo choàng của sự kiêu hãnh, nắm chặt quyền trượng và tiếp tục bành trướng đế chế lừng lẫy của mình. Quá đỗi tự hào và xuất sắc! 👑⚔️",
        "🎨 MỘT KIỆT TÁC NGHỆ THUẬT VƯỢT THỜI GIAN! Lời chúc mừng chan chứa cảm xúc và sự ngưỡng mộ xin gửi gắm đến {TEN} và Trợ Lý vì đã phác họa thành công bức tranh hùng vĩ mang tên {MOC}. Mọi nỗ lực, mọi giọt mồ hôi và cả những giọt nước mắt áp lực đã hóa thành những mảng màu rực rỡ nhất, kiến tạo nên một tác phẩm để đời vô giá. Từng góc máy, từng câu chuyện truyền tải đều toát lên một sự hoàn mỹ đáng kinh ngạc, chạm đến hàng triệu trái tim người hâm mộ. Sự tinh tế và đam mê nghệ thuật cháy bỏng đã nâng tầm tên tuổi của team lên một đẳng cấp hoàn toàn mới, bỏ xa mọi ranh giới thông thường. Đừng dừng lại, hãy tiếp tục cầm chắc cọ vẽ, pha trộn thêm những sắc độ độc đáo hơn nữa để vẽ nên một chặng đường tương lai ngập tràn hoa hồng và ánh sáng chói lòa. Ngưỡng mộ vô cùng! 🖼️✨",
        "🔥 CHÁY HẾT MÌNH VÀ BÙNG NỔ MỌI CẢM XÚC! Bầu không khí đang sôi sục hơn bao giờ hết để chúc mừng {TEN} cùng Trợ Lý đã giáng một đòn sấm sét cán mốc {MOC} vô tiền khoáng hậu. Sự cuồng nhiệt, máu lửa và tinh thần chiến đấu không khoan nhượng của mọi người đã tạo nên một sức mạnh cộng hưởng làm rung chuyển toàn bộ bảng xếp hạng. Các bạn đã chứng minh rằng, khi đam mê đủ lớn, mọi giới hạn vật lý đều có thể bị phá bỏ dễ dàng. Chiến thắng chấn động này không phải là may mắn, mà là minh chứng đanh thép cho một chiến lược thông minh và một khối óc nhạy bén tuyệt đỉnh. Đứng trên đỉnh cao chót vót này, hãy hít thở thật sâu thứ không khí của vinh quang, nạp đầy lồng ngực sự tự hào và chuẩn bị thổi bùng lên một ngọn lửa cuồng nộ hơn nữa trong những ngày sắp tới! 🚀💥",
        "🌪️ CƠN LỐC CỦA SỰ THỐNG TRỊ! Hoàn toàn choáng ngợp trước tốc độ bứt tốc khủng khiếp của {TEN} và Trợ Lý khi cuốn phăng mọi rào cản để chễm chệ tại mốc {MOC}. Sức mạnh vô hình nhưng cực kỳ tàn khốc của team đã thiết lập lại toàn bộ trật tự của cuộc chơi, đưa tên tuổi của các bạn lên một vì sao xa xôi không ai với tới được. Mọi sự cống hiến ngày đêm ròng rã nay đã được đền đáp bằng những con số biết nói vô cùng thuyết phục. Khả năng làm chủ tình huống và dẫn dắt xu hướng của mọi người quả thực đã đạt đến cảnh giới thượng thừa. Kỷ lục rực rỡ này sẽ là tấm bia đá khắc ghi sự nỗ lực phi thường của một tập thể kiên cường nhất. Tiếp tục cuộn trào sức mạnh, càn lướt qua mọi đấu trường và gom trọn vinh quang về tay mình nhé! 🌪️💎",
        "🌟 BỨT PHÁ KHÔNG GIAN, TỎA SÁNG XUYÊN MÀN ĐÊM! Xin gửi vạn lời khen ngợi sâu sắc nhất tới {TEN} cùng Trợ Lý vì đã thắp sáng cả dải ngân hà bằng kỷ lục {MOC} chói lọi. Giữa vô vàn những ngôi sao đang cạnh tranh khốc liệt, các bạn đã tìm ra cách để tự mình phát sáng rực rỡ nhất, bằng chính tài năng thực thụ và tình yêu thương vô bờ bản dành cho khán giả. Hành trình kỳ diệu này đã chứng minh rằng không có giấc mơ nào là quá lớn nếu chúng ta có đủ lòng kiên định để theo đuổi nó đến cùng. Ánh hào quang hiện tại là phần thưởng vô giá nhất, nhưng nó chưa phải là điểm dừng chân cuối cùng. Hãy tận dụng nguồn năng lượng tuyệt vời này để tiếp tục bay cao, bay xa, vươn tầm ảnh hưởng ra khỏi mọi ranh giới và trở thành những biểu tượng bất tử! 🌠🚀",
        "🌊 CƠN ĐỊA CHẤN TỪ ĐÁY ĐẠI DƯƠNG! Không thể tin nổi vào mắt mình trước sức mạnh càn lướt vĩ đại của {TEN} và Trợ Lý khi tạo ra cơn sóng thần xô đổ mốc {MOC}. Lặng lẽ chuẩn bị, âm thầm tích lũy sức mạnh để rồi bất ngờ trỗi dậy phá nát mọi kỷ lục cũ kỹ, chiến thuật của team thực sự là một cuốn sách giáo khoa mẫu mực về sự nhẫn nại. Các bạn đã bắt thế giới phải gọi tên mình bằng sự kính nể tuyệt đối. Mọi rào cản hay nghi ngờ đều đã bị chìm nghỉm trước thành quả đồ sộ ngày hôm nay. Hãy cứ tự hào dang rộng cánh tay đón nhận mọi vinh quang, tiếp tục lèo lái con thuyền chiến hạm này rẽ sóng ra khơi, chinh phạt những vùng biển bao la đầy ắp kho báu đang chờ đợi. Thật sự quá xuất sắc và phi thường! 🌊🚢",
        "🛡️ BỨC TƯỜNG THÀNH BẤT KHẢ XÂM PHẠM! Lời chúc mừng đầy uy quyền xin được vang lên để tôn vinh {TEN} cùng Trợ Lý với chiến tích phòng thủ và phản công đỉnh cao, chốt cứng mốc {MOC}. Đối mặt với hàng tá áp lực bủa vây, các bạn không hề nao núng mà ngược lại, còn đúc kết chúng thành những viên gạch kiên cố để xây dựng nên pháo đài bất khả chiến bại của riêng mình. Sự lì lợm, khôn ngoan và kỹ năng chuyên môn thượng đẳng đã giúp mọi người đẩy lùi mọi chướng ngại, hiên ngang vươn lên vị trí độc tôn. Đây chính là minh chứng cho câu nói 'lửa thử vàng, gian nan thử sức'. Cứ tiếp tục gia cố vững chắc vị thế quyền lực này, không ngừng hoàn thiện bản thân và sẵn sàng nghênh chiến với bất cứ thử thách nào. Ngai vàng này vĩnh viễn thuộc về các bạn! 🏰⚔️",
        "⚙️ BÁNH RĂNG VẬN HÀNH CHO MỘT ĐẾ CHẾ! Vô vàn lời ngợi ca dành trọn cho {TEN} và Trợ Lý vì đã vận hành hoàn hảo một hệ thống chiến thắng để thu về mốc {MOC} khổng lồ. Từng khâu chuẩn bị, từng phút giây lên sóng đều được lập trình một cách chuẩn xác không một vết xước, thể hiện sự chuyên nghiệp ở mức độ cao nhất. Sự kết hợp không thể tuyệt vời hơn giữa người biểu diễn và hậu phương vững chắc đã tạo ra một cỗ máy in thành tích khổng lồ. Quả ngọt hôm nay là hệ quả tất yếu của một chuỗi những sự lựa chọn và hành động đúng đắn không ngừng nghỉ. Hãy tiếp tục tra dầu cho cỗ máy đam mê này, giữ vững nhịp độ hủy diệt để cán nát mọi giới hạn, tiếp tục in đậm dấu ấn vĩ đại của mình lên bản đồ danh vọng nhé! 🏎️🥇",
        "⏳ THỜI GIAN LÀ MINH CHỨNG CHO ĐẲNG CẤP! Xin gửi lời chúc mừng đầy kiêu hãnh đến {TEN} cùng Trợ Lý khi đã chạm tay vào mốc {MOC} vô cùng danh giá. Để có được một vị trí ngạo nghễ như hiện tại, đó là sự đánh đổi của vô số những giờ phút miệt mài cống hiến, không cho phép bản thân được lùi bước dù chỉ một giây. Các bạn đã chứng minh được rằng, tài năng bẩm sinh nếu cộng hưởng với sự nỗ lực phi thường sẽ tạo ra một thứ quyền lực không thể bị xô đổ. Mỗi một phiên live đi qua đều để lại một dấu ấn đậm nét, biến tên tuổi của team thành một thương hiệu bảo chứng cho sự chất lượng và đẳng cấp. Khán giả hoàn toàn bị thuyết phục bởi sự chuyên nghiệp và sức hút ma mị tỏa ra từ các bạn. Hãy trân trọng chiếc vương miện này, tiếp tục mài giũa bản lĩnh và tỏa sáng rực rỡ như những viên kim cương đắt giá nhất. Tương lai rực rỡ đang hoàn toàn nằm trong tay các bạn! 👑💎",
        "🦅 CHÚA TỂ BẦU TRỜI ĐĐÃ GIANG RỘNG ĐÔI CÁNH! Chúc mừng {TEN} và Trợ Lý với một màn phô diễn sức mạnh áp đảo, thống trị hoàn toàn bảng xếp hạng để càn quét mốc {MOC}. Không cần những chiêu trò ồn ào, chính sự điềm tĩnh, mưu lược và khí chất ngút ngàn đã giúp các bạn thu phục mọi ánh nhìn và sự nể trọng. Các bạn giống như một con đại bàng kiêu hãnh, luôn biết cách chọn đúng thời điểm để tung ra những cú vồ mồi chuẩn xác và chí mạng nhất. Khát vọng chinh phục đỉnh cao đã rèn luyện cho toàn đội một bản lĩnh thép, không run sợ trước bất kỳ sóng gió nào. Khoảnh khắc vinh quang này chính là chiếc ngai vàng được đo ni đóng giày cho sự nỗ lực của các bạn. Hãy giữ vững vị thế độc tôn, tiếp tục sải cánh bay lượn trên tầng không cao nhất và khiến tất cả mọi người phải ngước nhìn ngưỡng mộ. Tuyệt vời! 🌪️🦅",

        "🌈 KỲ TÍCH SINH RA TỪ SỰ NỖ LỰC ĐIÊN RỒ! Xin gửi ngàn lời ngợi khen và thán phục nhất tới {TEN} cùng Trợ Lý khi đã chạm tay vào con số khổng lồ {MOC}. Có lẽ chỉ những người trong cuộc mới thấu hiểu hết sự hy sinh, mồ hôi và nước mắt đằng sau thứ ánh sáng lấp lánh này. Các bạn đã vắt kiệt sức lực, chiến đấu bền bỉ không ngừng nghỉ để tự tay dệt nên một huyền thoại cho riêng mình. Thành tựu vĩ đại này chính là phần thưởng xứng đáng nhất, là lời khẳng định đanh thép cho sự vô đối của team. Đứng ở đỉnh cao nhất, các bạn có quyền tự hào và kiêu hãnh với những gì mình đã kiến tạo. Đừng để ngọn lửa đam mê nguội lạnh, hãy biến vinh quang ngày hôm nay thành ngọn gió đưa các bạn bay lên những tầm cao vĩ đại hơn nữa. Xuất sắc và vô cùng đáng ngưỡng mộ! 🚀💎🏆",
        "🏆 BƯỚC LÊN ĐỈNH CAO DANH VỌNG! Chúc mừng {TEN} và Trợ Lý đã chính thức khắc tên mình vào đền đài của những huyền thoại với siêu kỷ lục {MOC}. Một màn càn quét đầy uy lực, thể hiện trọn vẹn bản lĩnh kiên cường, tầm nhìn xa trông rộng và sự đồng lòng tuyệt đối. Khi sức mạnh tập thể được phát huy ở mức tối đa, mọi rào cản dường như trở nên quá đỗi bé nhỏ. Các bạn đã biến một giấc mơ tưởng chừng như xa vời thành hiện thực sống động và rực rỡ nhất. Từng bước tiến vững chãi ấy đã và đang mở ra một kỷ nguyên mới do chính tay các bạn làm chủ. Cứ tiếp tục là những ngôi sao sáng nhất bầu trời, tự do tung hoành và chinh phục những đỉnh núi chót vót mà thế giới vẫn đang khao khát vươn tới nhé! 🌌✨🔥",
        "💎 VIÊN KIM CƯƠNG SÁNG NHẤT BẦU TRỜI! Thật sự xúc động và đầy tự hào khi được gửi lời chúc mừng đến {TEN} và Trợ Lý với cột mốc chấn động {MOC}. Hành trình chinh phục đỉnh cao này giống như việc mài giũa một viên kim cương thô, chịu vô vàn áp lực và gian khó để cuối cùng tỏa ra thứ ánh sáng huy hoàng và lộng lẫy nhất. Sự cống hiến quên mình và một tinh thần không bao giờ bỏ cuộc đã giúp các bạn đập tan mọi giới hạn của bản thân. Hôm nay, quyền lực tối cao nhất đã gọi tên các bạn. Hãy trân trọng và ăn mừng chiến thắng ngọt ngào này một cách hoành tráng nhất, bởi vì các bạn hoàn toàn xứng đáng với mọi mỹ từ ca ngợi. Cứ tiếp tục là những chiến binh vĩ đại, oai hùng tiến về phía trước và để lại những dấu ấn khó phai nhé! 👑🌟🚀",

        "🌌 KIẾN TẠO KỶ NGUYÊN VŨ TRỤ MỚI! Hôm nay quả là một ngày mang tính lịch sử vĩ đại khi chúng ta được chứng kiến {TEN} và Trợ Lý chính thức phá vỡ mọi quy luật, vươn mình càn lướt để chạm tới siêu mốc {MOC}! Mọi từ ngữ ca ngợi có lẽ đều trở nên bất lực, không thể nào diễn tả trọn vẹn được sự xuất sắc đến mức siêu việt và màn trình diễn mang tầm vóc vũ trụ này của toàn đội. Những chuỗi ngày live miệt mài vắt kiệt sức lực, những chiến thuật tương tác được tính toán tỉ mỉ đến từng chi tiết nhỏ nhất, tất cả đã kết tinh thành một siêu kỷ lục chấn động toàn tập, vượt xa mọi giới hạn và khiến tất cả mọi người đều phải ngả mũ thán phục. Đây không đơn thuần chỉ là một thành tích trên bảng xếp hạng, mà nó chính là một biểu tượng quyền lực vĩnh cửu, một di sản sống động do chính đôi bàn tay, khối óc và sự ăn ý tuyệt đối của các bạn tạo nên. Ngôi vương tuyệt đối này sinh ra là để khắc ghi tên những chiến binh kiên cường nhất, dám nghĩ, dám đánh đổi để chạm đỉnh. Hãy để cả thế giới chiêm ngưỡng ánh hào quang rực rỡ này. Tuyệt đỉnh vinh quang, ngàn lần vinh danh! 🏆⚡💎",
        "💥 ĐỊA CHẤN XUYÊN THẾ KỶ, PHÁ VỠ MỌI GIỚI HẠN VẬT LÝ! Thật sự kinh ngạc và nổi da gà trước sức mạnh hủy diệt toàn diện của {TEN} cùng Trợ Lý khi giáng một đòn chí mạng để xác lập siêu kỷ lục {MOC} vô tiền khoáng hậu. Các bạn không chỉ đơn giản là đang thi đấu, mà các bạn đang cầm bút viết lại toàn bộ cuốn từ điển về sự thành công và định nghĩa lại giới hạn của con người. Để có được một khoảnh khắc đứng trên đỉnh thế giới như lúc này, vô vàn những đêm thức trắng vắt óc suy nghĩ kịch bản, vô vàn những áp lực vô hình đè nặng lên vai đã bị các bạn nghiền nát bằng một ý chí sắt đá không thể bẻ gãy. Sự kết hợp hoàn mỹ giữa một tinh thần thép và một tài năng thiên bẩm đã mở ra một hố đen cuốn phăng mọi đối thủ, chiếm giữ ngôi vương một cách độc tôn và kiêu hãnh nhất. Huyền thoại không sinh ra từ hư vô, huyền thoại được sinh ra từ máu, mồ hôi và nước mắt của những vĩ nhân. Hãy hiên ngang nâng cao chiếc cúp vô địch này, vì nó hoàn toàn xứng đáng với tầm vóc vĩ đại của team. Chúc mừng một thế kỷ mới đã bắt đầu! 👑🔥🌟",
        "🚀 THOÁT KHỎI LỰC HẤP DẪN, TIẾN VÀO KHÔNG GIAN BẤT TỬ! Mọi quy chuẩn dường như đã bị xé bỏ hoàn toàn khi {TEN} và Trợ Lý chính thức khai hỏa động cơ, xuyên thủng bầu khí quyển để neo đậu tại siêu mốc {MOC} huyền thoại. Chúngra đang đứng trước một trong những thành tựu vĩ đại nhất, một cột mốc đánh dấu sự lột xác ngoạn mục và sự trưởng thành vượt bậc của cả một tập thể xuất chúng. Không còn sự gò bó, không còn những ranh giới an toàn, các bạn đã dũng cảm bước ra khỏi vùng vẫy để tự tay chạm vào những vì tinh tú sáng nhất của dải ngân hà. Đằng sau ánh sáng chói lòa này là sự cống hiến điên cuồng, là khát vọng bứt phá mãnh liệt cháy bùng trong từng huyết quản. Cả cộng đồng đang chấn động và nghiêng mình kính nể trước quyền lực tối thượng mà các bạn đã kiến tạo. Đừng để cho ngọn lửa nhiệt huyết này tàn lụi, hãy biến nó thành lò phản ứng hạt nhân vĩnh cửu để tiếp tục thắp sáng vũ trụ danh vọng. Kiệt tác này sinh ra là để khắc tên các bạn vào sự vĩnh hằng! 🚀🌠💎",
        "👑 TÁI ĐỊNH NGHĨA SỰ HOÀN MỸ BẰNG QUYỀN TRƯỢNG TỐI CAO! Ngàn vạn lời ca ngợi hùng hồn nhất xin được dâng lên để vinh danh {TEN} cùng Trợ Lý với siêu kỷ lục kinh thiên động địa {MOC}. Khi nghệ thuật biểu diễn chạm đến đỉnh cao của sự thăng hoa, kết hợp cùng một hậu phương vững chắc mưu trí, chúng ta có một đế chế bất khả chiến bại. Các bạn đã chứng minh cho cả thế giới thấy rằng, ngai vàng không dành cho kẻ mộng mơ, mà dành cho những người hành động quyết liệt với một trái tim quả cảm nhất. Từng giọt mồ hôi nhọc nhằn, từng giây phút căng thẳng đến nghẹt thở nay đã được đền bù bằng một vinh quang huy hoàng, rực rỡ đến mức làm lu mờ mọi thứ xung quanh. Sự vĩ đại này sẽ được ghi vào sử sách như một minh chứng sống động cho sức mạnh của lòng kiên trì và tài năng xuất chúng. Hãy vững vàng cầm chắc quyền trượng thống trị, đội chiếc vương miện danh giá này và tiếp tục cai trị bảng vàng bằng một phong độ hủy diệt vô song. Rất đỗi tự hào và vinh dự khi được chứng kiến khoảnh khắc lịch sử này! 🏰⚔️🏆",
        "🌊 CƠN ĐẠI HỒNG THỦY CUỐN PHĂNG MỌI KỶ LỤC CŨ! Hoàn toàn tĩnh lặng trước uy lực gầm rú kinh hoàng của {TEN} và Trợ Lý khi tạo ra một cơn cuồng phong càn quét và nhấn chìm mọi giới hạn để xác lập mốc {MOC} siêu việt. Thật khó tin khi chứng kiến sức mạnh vô hạn được giải phóng từ một tập thể luôn biết cách biến áp lực thành năng lượng. Các bạn đã lèo lái con thuyền chiến hạm băng qua muôn trùng tâm bão, xé nát mọi hoài nghi để kiêu hãnh cắm ngọn cờ chiến thắng trên hòn đảo của những vị thần. Mọi rào cản sinh ra dường như chỉ làm nền cho sự bứt phá của team thêm phần ngoạn mục. Đây không phải là điểm rơi phong độ, mà là sự bùng nổ của một núi lửa đã âm ỉ tích tụ qua hằng bao đêm vất vả cực nhọc. Huyền thoại là những người biết cách tạo ra phép màu, và các bạn chính là những phù thủy vĩ đại nhất của ngày hôm nay. Hãy cứ tự do bành trướng sức mạnh khủng khiếp này, càn quét mọi đấu trường và thu về toàn bộ những vinh quang chói lọi nhất. Không có giới hạn nào cho những vị thần! 🌊🚢⚡",

      function getTemplatesForTier(tier) {
        let numStr = (tier || "").replace(/[^0-9]/g, '');
        let val = parseInt(numStr);
        if (isNaN(val)) return msgsStart;

        if (val >= 300) return msgsLegend;  
        if (val >= 100) return msgsVip;     
        if (val >= 50)  return msgsMid;     
        return msgsStart;                   
      }

      function assignUniqueMessage(item) {
        let templates = getTemplatesForTier(item.tier);
        let usedIndices = currentData
          .filter(i => i.id !== item.id && getTemplatesForTier(i.tier) === templates && i.templateIndex !== undefined)
          .map(i => i.templateIndex);

        let availableIndices = [];
        for (let idx = 0; idx < templates.length; idx++) {
          if (!usedIndices.includes(idx)) availableIndices.push(idx);
        }

        let chosenIndex;
        if (availableIndices.length > 0) {
          chosenIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
        } else {
          let otherIndices = Array.from({length: templates.length}, (_, k) => k).filter(k => k !== item.templateIndex);
          chosenIndex = otherIndices.length > 0 ? otherIndices[Math.floor(Math.random() * otherIndices.length)] : 0;
        }

        item.templateIndex = chosenIndex;
        let baseMsg = templates[chosenIndex].replace(/{TEN}/g, item.name).replace(/{MOC}/g, item.tier);
        item.baseMessage = baseMsg;
        if (item.withAssistant === undefined) item.withAssistant = true; 
        item.message = item.withAssistant ? item.baseMessage : item.baseMessage.replace(/( và| cùng) Trợ Lý/g, "");
      }

      function toggleAssistant(id, isChecked) {
        let item = currentData.find(i => i.id === id);
        if (!item) return;

        item.withAssistant = isChecked;
        item.message = item.withAssistant ? item.baseMessage : item.baseMessage.replace(/( và| cùng) Trợ Lý/g, "");

        let textarea = document.getElementById(`msg-${item.id}`);
        if (textarea) textarea.value = item.message;
      }

      function changeMessage(id) {
        let item = currentData.find(i => i.id === id);
        if (!item) return;

        assignUniqueMessage(item);
        let textarea = document.getElementById(`msg-${id}`);
        if (textarea) textarea.value = item.message;
        showToast(`Đã đổi lời chúc mới cho ${item.name}!`);
      }

      // ==============================================
      // QUẢN LÝ THẺ TẠO NHANH (QUICK CREATE CARD)
      // ==============================================
      let manualState = {
          templateIndex: null,
          baseMessage: "",
          lastTierLevel: null 
      };

      function handleTierInput(el) {
          el.value = el.value.replace(/[^0-9]/g, '');
          updateManualMessage();
      }

      function handleTierChange(el) {
          let val = parseInt(el.value.replace(/[^0-9]/g, ''));
          if (!isNaN(val)) {
              let tierK = val >= 1000 ? Math.floor(val / 1000) : val;
              el.value = tierK + "K";
          } else {
              el.value = "";
          }
          updateManualMessage();
      }

      function updateManualMessage() {
          let name = document.getElementById('manual-name').value.trim() || "{TEN}";
          let rawTier = document.getElementById('manual-tier').value.replace(/[^0-9]/g, '');
          
          let tierStr = "{MOC}";
          if (rawTier !== "") {
              let val = parseInt(rawTier);
              let tierK = val >= 1000 ? Math.floor(val / 1000) : val;
              tierStr = tierK + "K";
          }

          let templates = getTemplatesForTier(tierStr);
          if (manualState.lastTierLevel !== templates || manualState.templateIndex === null) {
              manualState.templateIndex = Math.floor(Math.random() * templates.length);
              manualState.lastTierLevel = templates;
          }

          let baseMsg = templates[manualState.templateIndex].replace(/{TEN}/g, name).replace(/{MOC}/g, tierStr);
          manualState.baseMessage = baseMsg;

          let withAssistant = document.getElementById('manual-assistant').checked;
          let finalMsg = withAssistant ? baseMsg : baseMsg.replace(/( và| cùng) Trợ Lý/g, "");
          document.getElementById('manual-msg').value = finalMsg;

          // Đồng bộ Đổi màu Thẻ & Badge
          let st = getTierStyle(tierStr);
          let card = document.getElementById('quick-create-card');
          let title = document.getElementById('manual-title');
          let badge = document.getElementById('manual-badge');

          if(card && title && badge) {
              card.style.borderColor = st.a;
              card.style.boxShadow = `0 0 15px ${st.a}50`;
              card.style.background = `linear-gradient(145deg, var(--bg-panel), ${st.b})`;
              title.style.color = st.a;
              title.style.textShadow = `0 0 10px ${st.a}40`;

              if (tierStr !== "{MOC}") {
                  badge.style.display = 'inline-flex';
                  badge.style.alignItems = 'center';
                  badge.style.background = st.b;
                  badge.style.color = st.a;
                  badge.style.border = `1px solid ${st.a}`;
                  badge.style.boxShadow = `0 2px 10px ${st.b}`;
                  badge.innerHTML = `${st.i} ${tierStr}`;
              } else {
                  badge.style.display = 'none';
              }
          }
      }

      function forceChangeManual() {
          let rawTier = document.getElementById('manual-tier').value.replace(/[^0-9]/g, '');
          let tierStr = "{MOC}";
          if (rawTier !== "") {
              let val = parseInt(rawTier);
              let tierK = val >= 1000 ? Math.floor(val / 1000) : val;
              tierStr = tierK + "K";
          }
          let templates = getTemplatesForTier(tierStr);
          manualState.templateIndex = Math.floor(Math.random() * templates.length);
          updateManualMessage();
          showToast("Đã đổi lời chúc tạo nhanh!");
      }

      function copyManual() {
          let msg = document.getElementById('manual-msg').value;
          if (!msg) return;
          navigator.clipboard.writeText(msg);
          
          let rawTier = document.getElementById('manual-tier').value.replace(/[^0-9]/g, '');
          let tierStr = "";
          if (rawTier !== "") {
              let val = parseInt(rawTier);
              let tierK = val >= 1000 ? Math.floor(val / 1000) : val;
              tierStr = tierK + "K";
          }
          let st = getTierStyle(tierStr);
          
          if (st.c === 'epic-100k') confetti({ particleCount: 50, spread: 80, colors: ['#fef08a'], shapes: ['star'] });
          else if (st.c === 'epic-500k') confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 } });
          else confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 }, colors: [st.a, '#ffffff'] });
          
          showToast("Đã copy lời chúc tạo nhanh!");
      }

      // ==============================================

      let currentData = [];
      let currentTab = 'pending';
      let dpInstance; let lastRequestedDate = ""; let isInitializing = false;
      let focusedIndex = -1; 

      runScript('getInitialData')
        .then(initApp)
        .catch(err => {
            document.getElementById('app').innerHTML = '<div style="padding: 20px; color: #ef4444; font-weight: bold; text-align: center;">Lỗi kết nối hoặc chưa đúng tên Sheet.</div>';
        });

      function initApp(response) {
        if (!response) { document.getElementById('app').innerHTML = '<div style="padding: 20px; color: #ef4444; font-weight: bold; text-align: center;">Lỗi kết nối hoặc chưa đúng tên Sheet.</div>'; return; }
        isInitializing = true;
        
        const localeVi = { days: ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'], daysShort: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], daysMin: ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'], months: ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'], monthsShort: ['Thg 1', 'Thg 2', 'Thg 3', 'Thg 4', 'Thg 5', 'Thg 6', 'Thg 7', 'Thg 8', 'Thg 9', 'Thg 10', 'Thg 11', 'Thg 12'], today: 'Hôm nay', clear: 'Xóa', dateFormat: 'yyyy-MM-dd', firstDay: 0 };

        if (!dpInstance) {
          dpInstance = new AirDatepicker('#datePicker', {
            locale: localeVi, autoClose: true, dateFormat: 'yyyy-MM-dd',
            onSelect: function({formattedDate}) {
              if(formattedDate && !isInitializing && formattedDate !== lastRequestedDate) { requestChangeDate(formattedDate); }
            }
          });
        }
        if(response.currentDate) {
          lastRequestedDate = response.currentDate;
          let p = response.currentDate.split('-');
          dpInstance.selectDate(new Date(p[0], p[1]-1, p[2]), {silent: true}); 
        }
        isInitializing = false;
        
        currentData = response.messages;
        currentData.forEach(item => {
           if (item.status === 'pending') {
               assignUniqueMessage(item);
           }
        });

        populateFilters();
        renderCards();
        
        setInterval(silentRefresh, 300000); 
      }

      function showToast(msg) {
        let container = document.getElementById('toast-container');
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `✅ ${msg}`;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('fade-out'); setTimeout(()=> toast.remove(), 400); }, 3000);
      }

      function toggleTheme() { document.body.classList.toggle('light-mode'); }

      function requestChangeDate(selectedDate) {
        if(!selectedDate || selectedDate === lastRequestedDate) return; 
        lastRequestedDate = selectedDate; 
        document.getElementById('app').innerHTML = `<div class="card skeleton"><div class="skel-title"></div><div class="skel-box"></div><div style="display:flex; gap:10px;"><div class="skel-btn"></div><div class="skel-btn"></div></div></div>`;
        
        runScript('changeDateAndFetchData', { dateString: selectedDate })
          .then(initApp)
          .catch(error => {
             document.getElementById('app').innerHTML = `<div style="padding: 20px; color: #ef4444; font-weight: bold; text-align: center;">Lỗi tải dữ liệu: ${error.message}. Vui lòng kiểm tra lại tên Sheet.</div>`;
          });
      }

      function silentRefresh() {
        runScript('pollCurrentData')
            .then(res => {
                if(res && res.length > currentData.length) {
                    document.getElementById('dot-new').style.display = 'block'; 
                    showToast("Có dữ liệu Idol mới vừa cán mốc!");
                }
            })
            .catch(e => console.log(e));
      }

      function changeTab(tabName) {
        currentTab = tabName;
        document.getElementById('tab-pending').classList.toggle('active', tabName === 'pending');
        document.getElementById('tab-done').classList.toggle('active', tabName === 'done');
        if(tabName === 'pending') document.getElementById('dot-new').style.display = 'none'; 
        
        let manualContainer = document.getElementById('manual-card-container');
        if(manualContainer) manualContainer.style.display = (tabName === 'pending') ? 'grid' : 'none';
        
        renderCards();
      }

      function populateFilters() {
        let uniqueTiers = [...new Set(currentData.map(item => item.tier))].filter(Boolean);
        let filterSelect = document.getElementById('tierFilter');
        filterSelect.innerHTML = '<option value="all">Tất cả</option>';
        
        uniqueTiers.sort((a, b) => {
            let numA = parseInt((a || "").replace(/[^0-9]/g, '')) || 0;
            let numB = parseInt((b || "").replace(/[^0-9]/g, '')) || 0;
            return numA - numB;
        }).forEach(tier => { 
            filterSelect.innerHTML += `<option value="${tier}">${tier}</option>`; 
        });
      }

      function getTierStyle(t) {
        let numStr = (t || "").replace(/[^0-9]/g, '');
        let val = parseInt(numStr);
        
        if (isNaN(val)) return { a:'#64748b', b:'rgba(100,116,139,0.1)', c:'', i:'🎯' };

        if (val >= 500) return { a:'#ec4899', b:'rgba(236,72,153,0.15)', c:'epic-500k', i:'👑' };
        if (val >= 300) return { a:'#ef4444', b:'rgba(239,68,68,0.15)', c:'epic-300k', i:'🔥' };
        if (val >= 200) return { a:'#a855f7', b:'rgba(168,85,247,0.15)', c:'epic-200k', i:'💎' };
        if (val >= 100) return { a:'#fbbf24', b:'rgba(251,191,36,0.15)', c:'epic-100k', i:'⭐' };
        if (val >= 60)  return { a:'#0ea5e9', b:'rgba(14,165,233,0.15)', c:'epic-60k', i:'✨' };
        if (val >= 50)  return { a:'#3b82f6', b:'rgba(59,130,246,0.15)', c:'epic-50k', i:'🚀' };
        if (val >= 40)  return { a:'#3b82f6', b:'rgba(59,130,246,0.1)', c:'', i:'🚀' };
        if (val >= 30)  return { a:'#10b981', b:'rgba(16,185,129,0.1)', c:'', i:'🌱' };
        
        return { a:'#64748b', b:'rgba(100,116,139,0.1)', c:'', i:'🎯' };
      }

      function renderCards() {
        focusedIndex = -1; 
        const appDiv = document.getElementById('app');
        
        document.getElementById('count-pending').innerText = currentData.filter(i => i.status === 'pending').length;
        document.getElementById('count-done').innerText = currentData.filter(i => i.status === 'done').length;

        let displayData = currentData.filter(i => i.status === currentTab);
        let selTier = document.getElementById('tierFilter').value;
        if(selTier !== 'all') displayData = displayData.filter(i => i.tier === selTier);
        let sortMode = document.getElementById('sortSelect').value;
        displayData.sort((a,b) => sortMode === 'asc' ? a.coinRaw - b.coinRaw : b.coinRaw - a.coinRaw);

        if(displayData.length === 0) { appDiv.innerHTML = '<div class="loader" style="grid-column: 1/-1; padding-top: 50px;">Không có dữ liệu.</div>'; document.body.style.setProperty('--ambient-color', 'transparent'); return; }

        let html = '';
        let highestAmbient = '#131722'; 
        let delayCounter = 0; 

        displayData.forEach((item, idx) => {
          let st = getTierStyle(item.tier);
          let delay = delayCounter * 0.06;
          delayCounter++;

          if(idx === displayData.length - 1 && sortMode === 'asc') highestAmbient = st.a; 
          else if (idx === 0 && sortMode === 'desc') highestAmbient = st.a;

          if(currentTab === 'pending') {
          html += `
            <div class="card ${st.c} card-nav" id="card-${item.id}" style="--accent:${st.a}; --accent-bg:${st.b}; --accent-border:${st.a}55; animation-delay: ${delay}s;" data-idx="${idx}">
              
              <div class="card-header">
                <div style="display:flex; align-items:center; gap:10px;">
                  <h3 class="idol-name">${item.name}</h3><span class="badge">${st.i} ${item.tier}</span>
                </div>
                
                <label class="toggle-switch" title="Bật/Tắt Trợ Lý">
                  <span class="toggle-label">Trợ lý</span>
                  <input type="checkbox" ${item.withAssistant !== false ? 'checked' : ''} onchange="toggleAssistant('${item.id}', this.checked)">
                  <span class="toggle-slider"></span>
                </label>
              </div>

              <div class="coin-info"><span style="opacity:0.7">Điểm: </span> <span class="coin-val" style="margin-left:4px;">${item.coin}</span></div>
              <textarea id="msg-${item.id}" class="msg-box" spellcheck="false">${item.message}</textarea>
              
              <div class="action-group">
                <button class="btn btn-main btn-do-copy" onclick="handleCopy('${item.id}', ${item.row}, ${item.col}, '${st.c}', '${st.a}')">📋 Copy</button>
                <button class="btn btn-sec" onclick="changeMessage('${item.id}')">🔀 Đổi chúc</button>
              </div>
              
            </div>`;
          } else {
            html += `
              <div class="card done card-nav" style="animation-delay: ${delay}s;" data-idx="${idx}">
                <div class="card-header">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <h3 class="idol-name">${item.name}</h3>
                        <span class="badge" style="color:#94a3b8; border-color:#475569">${st.i} ${item.tier}</span>
                    </div>
                </div>
                <textarea id="msg-${item.id}" class="msg-box" readonly>${item.message}</textarea>
                <div class="action-group">
                  <button class="btn btn-sec" onclick="copyOnly('${item.id}')">🔄 Copy Lại</button>
                  <button class="btn btn-sec" onclick="handleUndo('${item.id}', ${item.row}, ${item.col})">↩ Hoàn tác</button>
                </div>
              </div>`;
          }
        });
        appDiv.innerHTML = html;
        
        if (currentTab === 'pending') {
            document.body.style.setProperty('--ambient-color', highestAmbient);
        } else {
            document.body.style.setProperty('--ambient-color', 'transparent');
        }
      }

      document.addEventListener('keydown', (e) => {
         if(currentTab !== 'pending') return;
         let cards = document.querySelectorAll('.card-nav');
         if(cards.length === 0) return;
         if(document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return; 

         if(e.key === 'ArrowRight' || e.key === 'ArrowDown') {
             e.preventDefault();
             if(focusedIndex > -1) cards[focusedIndex].classList.remove('key-focus');
             focusedIndex = (focusedIndex + 1) % cards.length;
             cards[focusedIndex].classList.add('key-focus');
             cards[focusedIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
         } 
         else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
             e.preventDefault();
             if(focusedIndex > -1) cards[focusedIndex].classList.remove('key-focus');
             focusedIndex = (focusedIndex - 1 + cards.length) % cards.length;
             cards[focusedIndex].classList.add('key-focus');
             cards[focusedIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
         }
         else if (e.key === 'Enter') {
             e.preventDefault();
             if(focusedIndex > -1) { cards[focusedIndex].querySelector('.btn-do-copy').click(); }
         }
      });

      function handleCopy(id, sheetRow, sheetCol, tierClass, particleColor) {
        let textarea = document.getElementById(`msg-${id}`);
        let finalMessage = textarea.value; 
        
        navigator.clipboard.writeText(finalMessage);
        
        if (tierClass === 'epic-100k') confetti({ particleCount: 50, spread: 80, colors: ['#fef08a'], shapes: ['star'] });
        else if (tierClass === 'epic-500k') confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 } });
        else confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 }, colors: [particleColor, '#ffffff'] });
        
        showToast("Đã lưu vào bộ nhớ tạm!");

        let itemIndex = currentData.findIndex(item => item.id === id);
        if(itemIndex > -1) {
            currentData[itemIndex].status = 'done'; 
            currentData[itemIndex].message = finalMessage; 
        }
        renderCards(); 
        
        runScript('markAsCopied', { row: sheetRow, col: sheetCol }).catch(e => console.log(e));
      }

      function copyOnly(id) {
        let val = document.getElementById(`msg-${id}`).value;
        navigator.clipboard.writeText(val);
        showToast("Đã copy lại!");
      }

      function handleUndo(id, sheetRow, sheetCol) {
        let idx = currentData.findIndex(i => i.id === id);
        if(idx > -1) currentData[idx].status = 'pending'; 
        renderCards(); 
        runScript('unmarkAsCopied', { row: sheetRow, col: sheetCol }).catch(e => console.log(e)); 
      }
    </script>
  </body>
</html>
